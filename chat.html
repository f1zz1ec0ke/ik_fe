<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - ik_llama.cpp</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="chat.css">
</head>
<body class="chat-body">
    <!-- Background layer -->
    <div class="background-layer">
        <div class="background-gradient"></div>
        <div class="background-pattern"></div>
    </div>

    <!-- Main chat interface -->
    <div class="chat-container">
        <!-- Top bar -->
        <div class="chat-header glass-panel">
            <div class="header-left">
                <button class="back-btn" onclick="window.location.href='index.html'">← Back</button>
                <div class="model-info">
                    <span class="model-name" id="model-name">Loading...</span>
                    <span class="model-status" id="model-status">Ready</span>
                </div>
            </div>
            <div class="header-right">
                <div class="chat-metrics">
                    <span class="metric" id="tokens-metric">0 tokens</span>
                    <span class="metric" id="speed-metric">0 t/s</span>
                </div>
                <button class="settings-btn" id="settings-btn">⚙️</button>
                <button class="theme-toggle" id="theme-toggle">🌙</button>
            </div>
        </div>

        <!-- Chat messages area -->
        <div class="chat-messages-container glass-panel">
            <div class="chat-messages" id="chat-messages">
                <div class="welcome-message">
                    <div class="welcome-icon">💬</div>
                    <h3>Welcome to ik_llama.cpp Chat</h3>
                    <p>Your AI assistant is ready. Start a conversation!</p>
                </div>
            </div>
        </div>

        <!-- Input area -->
        <div class="chat-input-container glass-panel">
            <div class="input-wrapper">
                <textarea 
                    id="user-input" 
                    placeholder="Type your message..." 
                    rows="1"
                    maxlength="4000"
                ></textarea>
                <div class="input-actions">
                    <button class="input-btn" id="clear-btn" title="Clear chat">🗑️</button>
                    <button class="input-btn" id="stop-btn" title="Stop generation" disabled>⏹️</button>
                    <button class="send-btn" id="send-btn" disabled>
                        <span class="send-icon">→</span>
                    </button>
                </div>
            </div>
            <div class="input-footer">
                <span class="char-count" id="char-count">0 / 4000</span>
                <span class="input-hint">Press Enter to send, Shift+Enter for new line</span>
            </div>
        </div>
    </div>

    <!-- Settings panel (initially hidden) -->
    <div class="settings-panel glass-panel" id="settings-panel">
        <div class="settings-header">
            <h3>Chat Settings</h3>
            <button class="close-btn" id="close-settings">×</button>
        </div>
        <div class="settings-content">
            <div class="settings-section">
                <h4>Generation Parameters</h4>
                <div class="setting-item">
                    <label for="temperature">Temperature:</label>
                    <input type="range" id="temperature" min="0.1" max="2.0" step="0.1" value="0.8">
                    <span id="temp-value">0.8</span>
                </div>
                <div class="setting-item">
                    <label for="max-tokens">Max Tokens:</label>
                    <input type="number" id="max-tokens" min="1" max="4096" value="512">
                </div>
                <div class="setting-item">
                    <label for="top-p">Top P:</label>
                    <input type="range" id="top-p" min="0.1" max="1.0" step="0.05" value="0.95">
                    <span id="top-p-value">0.95</span>
                </div>
            </div>
            <div class="settings-section">
                <h4>System Prompt</h4>
                <textarea id="system-prompt" rows="3" placeholder="Enter system prompt..."></textarea>
            </div>
            <div class="settings-section">
                <h4>Chat Options</h4>
                <label class="checkbox-item">
                    <input type="checkbox" id="auto-scroll" checked>
                    <span class="checkmark"></span>
                    Auto-scroll to new messages
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="show-thinking" checked>
                    <span class="checkmark"></span>
                    Show thinking sections
                </label>
            </div>
        </div>
    </div>

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
        <p>Loading model configuration...</p>
    </div>

    <script src="chat.js"></script>
</body>
</html>
